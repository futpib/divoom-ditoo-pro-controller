format = 2
stock_sha256 = "fc16341c005b11d0ac476917dc2fd98c9bc7481b92a183e64bfe209801566544"

[profiles.reflash]
version = 306008
patches = [
    "firmware_version",
    "allow_reflash",
]

[profiles.probe]
version = 306009
patches = [
    "command_dispatch",
    "firmware_version",
    "allow_reflash",
]

[profiles.runtime]
version = 306012
source_patches = ["lua/0001-bounded-runtime.patch"]
patches = [
    "command_dispatch",
    "runtime_init",
    "heap_reservation",
    "firmware_version",
    "allow_reflash",
]

[profiles.app]
version = 306025
source_patches = ["lua/0001-bounded-runtime.patch", "lua/0002-resident-app.patch"]
patches = [
    "command_dispatch",
    "runtime_init",
    "screen_ownership",
    "physical_keys",
    "keyboard_lights",
    "native_jobs",
    "usb_receive",
    "usb_send",
    "usb_response",
    "usb_connected",
    "bluetooth_commands",
    "bluetooth_stack_trace",
    "bluetooth_hci_trace",
    "battery_indicator",
    "microphone_level",
    "wake_selection",
    "heap_reservation",
    "alarm_cleanup",
    "wake_cleanup",
    "wake_slot",
    "firmware_version",
    "allow_reflash",
]

[[patches]]
name = "command_dispatch"
section = ".hook"
site = "stock_patch_dispatch"
max_size = 28
original_size = 30
purpose = "Route the native extension command to the bounded runtime."
original = '''
    lbi333 $r0, [$r7 + 1]
    bnez38 $r0, stock_patch_dispatch_branch_2
    jal stock_version
    j stock_dispatch_end
    addi $r0, $r7, 2
    jal stock_set_version
    j stock_dispatch_end
    lbi333 $r0, [$r7 + 1]
    bnez $r0, stock_dispatch_end
'''

[[patches]]
name = "runtime_init"
section = ".init_hook"
site = "stock_patch_init"
max_size = 4
original_size = 4
purpose = "Start the Lua worker after stock initialization."
original = '''
    jal stock_heap_init
'''

[[patches]]
name = "screen_ownership"
section = ".screen_hook"
site = "stock_patch_screen"
max_size = 4
original_size = 4
purpose = "Let active Lua apps own the screen."
original = '''
    smw.adm $r6, [$sp], $r6, 0x2
'''

[[patches]]
name = "physical_keys"
section = ".key_hook"
site = "stock_patch_key"
max_size = 4
original_size = 4
purpose = "Deliver physical keys to Lua while retaining native power handling."
original = '''
    jal stock_adc_scan
'''

[[patches]]
name = "keyboard_lights"
section = ".led_hook"
site = "stock_patch_led"
max_size = 4
original_size = 4
purpose = "Apply Lua keyboard lighting on the native task."
original = '''
