'''

[[guards]]
site = "stock_bt_dispatch_guard"
profiles = ["app"]
original_size = 16
purpose = "Validate the native ABI used by bt_dispatch_guard."
original = '''
    lwi37.sp $r0, [ + 0xc]
    beqz $r0, stock_bt_dispatch_guard_branch_2
    subi45 $r0, 1
    slti $r15, $r0, 0x4a
    beqz $r15, stock_bt_dispatch_tail
'''

[[guards]]
site = "stock_bt_dispatch_tail"
profiles = ["app"]
original_size = 6
purpose = "Validate the native ABI used by bt_dispatch_tail."
original = '''
    jal stock_bt_dispatch_tail_branch_1
    pop25 $r10, 48
'''

